name: Release

# Attaches a ready-to-install archive (source plus the built program) and the notes
# from that version's section in CHANGELOG.md to a GitHub release. Runs when a tag like
# v2.0.0 is pushed or a release is published from the Releases page, or by hand (Actions
# tab, Release, Run workflow): it then uses the version in Cargo.toml. An existing
# release gets its notes rewritten and the archive replaced.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match Cargo.toml's version $v"; exit 1
          fi
          grep -q "^## $v " CHANGELOG.md || { echo "CHANGELOG.md has no '## $v' section"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GTK 4
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - name: Test and build
        run: |
          cargo test --release
          cargo build --release
      - name: Build the archive
        run: |
          # The source, with the built program in bin/ for systems without Rust.
          git archive --format=tar --prefix="calculator-$VERSION/" -o archive.tar HEAD -- . ':!.github'
          mkdir -p "stage/calculator-$VERSION/bin"
          cp target/release/calculator "stage/calculator-$VERSION/bin/"
          tar -rf archive.tar -C stage "calculator-$VERSION/bin/calculator"
          gzip -c archive.tar > "calculator-$VERSION.tar.gz"
      - name: Write the release notes
        run: |
          awk -v head="## $VERSION " 'index($0, head) == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          cat >> notes.md <<NOTES

          ## Install or update

          **With git** (easiest to keep up to date). To install:

              git clone https://github.com/${GITHUB_REPOSITORY}.git
              cd Calculator
              ./install.sh

          To update a copy you cloned before, run these in its folder:

              git pull
              ./install.sh

          **Or download** calculator-$VERSION.tar.gz from the files below, then:

              tar xzf calculator-$VERSION.tar.gz
              cd calculator-$VERSION
              ./install.sh

          With Rust installed (\`sudo pacman -S rust gtk4\` on Arch), install.sh builds the program;
          without it, the download's ready-built program is used. Either way, your settings and history
          are kept. On Arch-based systems you can also build a package with \`makepkg -si\` in
          \`packaging/arch\`.
          NOTES
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "calculator-$VERSION.tar.gz" --clobber
            gh release edit "v$VERSION" --notes-file notes.md
          else
            gh release create "v$VERSION" "calculator-$VERSION.tar.gz" --title "$VERSION" \
              --notes-file notes.md --target "$GITHUB_SHA"
          fi
