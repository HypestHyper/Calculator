[package]
name = "calculator"
version = "0.1.0"
edition = "2021"
description = "Rust port of Calculator, a GTK 4 calculator for Linux"
license = "MIT"
repository = "https://github.com/HypestHyper/Calculator"
rust-version = "1.85"

[dependencies]
gtk = { version = "0.9.7", package = "gtk4" }
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.0.7"
