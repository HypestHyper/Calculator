[package]
name = "calculator"
version = "2.0.2"
edition = "2021"
description = "A GTK 4 Material 3 calculator for Linux"
license = "MIT"
repository = "https://github.com/HypestHyper/Calculator"
rust-version = "1.88"

[dependencies]
gtk = { version = "0.9.7", package = "gtk4", features = ["v4_10"] }
material-colors = { path = "vendor/material-colors" }
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.0.7"
